<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Магазин одежды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #1a1a1a);
  --hint: var(--tg-theme-hint-color, #86868b);
  --card: var(--tg-theme-secondary-bg-color, #f3f2ef);
  --btn: var(--tg-theme-button-color, #2f6f5e);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
body { font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 96px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
h1 { font-size: 26px; letter-spacing: -.02em; padding: 18px 16px 4px; }
.sub { color: var(--hint); padding: 0 16px 12px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--card); }
.chip.on { background: var(--text); color: var(--bg); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 0 16px; }
.card { text-align: left; }
.ph { aspect-ratio: 4/5; border-radius: 14px; display: grid; place-items: center; font-size: 64px; transition: transform .15s; }
.card:active .ph { transform: scale(.97); }
.nm { margin-top: 8px; line-height: 1.25; }
.pr { font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* карточка товара */
.shade { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.shade.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; }
.sheet.open { transform: none; }
.sheet .ph { aspect-ratio: 16/9; font-size: 72px; margin-bottom: 12px; }
.sheet h2 { font-size: 19px; }
.sheet .pr { font-size: 19px; margin: 4px 0 12px; }
.sizes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.size { min-width: 48px; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--card); background: var(--card); }
.size.on { border-color: var(--text); }
.primary { width: 100%; padding: 14px; border-radius: 12px; background: var(--btn); color: var(--btn-text); font-weight: 600; }

/* корзина */
.back { padding: 14px 16px 0; color: var(--hint); }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--card); }
.row .ph { width: 56px; aspect-ratio: 1; font-size: 28px; border-radius: 12px; flex: none; }
.row .info { flex: 1; min-width: 0; }
.row .meta { color: var(--hint); font-size: 13px; }
.qty { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; }
.qty button { width: 32px; height: 32px; font-size: 18px; }
.qty span { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; padding: 16px; font-size: 17px; font-weight: 600; }
.empty { text-align: center; color: var(--hint); padding: 72px 24px; }

/* кнопка-заглушка для запуска в обычном браузере (в Telegram работает MainButton) */
#bar { display: none; position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); padding: 14px; border-radius: 12px; background: var(--btn); color: var(--btn-text); font-weight: 600; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<button id="bar"></button>

<script>
const tg = window.Telegram?.WebApp;
const inTg = Boolean(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("ru-RU") + " ₽";
const haptic = (kind = "light") => inTg && tg.HapticFeedback.impactOccurred(kind);

let products = [], category = "Все", cart = [], view = "catalog", pick = null, mainHandler = null;
const byId = (id) => products.find((p) => p.id === id);
const count = () => cart.reduce((s, c) => s + c.qty, 0);
const total = () => cart.reduce((s, c) => s + byId(c.id).price * c.qty, 0);

/* --- нижняя кнопка: нативная MainButton в Telegram, обычная — в браузере --- */
function setMain(text, handler) {
  if (inTg) {
    if (mainHandler) tg.MainButton.offClick(mainHandler);
    mainHandler = handler;
    if (!text) return tg.MainButton.hide();
    tg.MainButton.setText(text);
    tg.MainButton.onClick(handler);
    tg.MainButton.show();
  } else {
    $("bar").style.display = text ? "block" : "none";
    $("bar").textContent = text || "";
    $("bar").onclick = handler;
  }
}

function updateMain() {
  if (!count()) return setMain(null);
  if (view === "catalog") setMain(`Корзина · ${count()} · ${fmt(total())}`, renderCart);
  else setMain(`Оформить заказ · ${fmt(total())}`, checkout);
}

/* --- каталог --- */
function renderCatalog() {
  view = "catalog";
  if (inTg) tg.BackButton.hide();
  const cats = ["Все", ...new Set(products.map((p) => p.category))];
  const list = products.filter((p) => category === "Все" || p.category === category);
  $("app").innerHTML = `
    <h1>Сукно</h1><p class="sub">Базовая одежда на каждый день</p>
    <div class="chips">${cats.map((c) => `<button class="chip ${c === category ? "on" : ""}" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="grid">${list.map((p) => `
      <button class="card" data-id="${p.id}">
        <div class="ph" style="background:${p.color}">${p.emoji}</div>
        <div class="nm">${p.name}</div><div class="pr">${fmt(p.price)}</div>
      </button>`).join("")}</div>`;
  updateMain();
}

/* --- карточка товара --- */
function openProduct(id) {
  const p = byId(id);
  pick = { id, size: p.sizes[0] };
  $("sheet").innerHTML = `
    <div class="ph" style="background:${p.color}">${p.emoji}</div>
    <h2>${p.name}</h2><div class="pr">${fmt(p.price)}</div>
    <div class="sizes">${p.sizes.map((s, i) => `<button class="size ${i === 0 ? "on" : ""}" data-size="${s}">${s}</button>`).join("")}</div>
    <button class="primary" id="add">Добавить в корзину</button>`;
  $("shade").classList.add("open");
  $("sheet").classList.add("open");
}
function closeProduct() {
  $("shade").classList.remove("open");
  $("sheet").classList.remove("open");
}

/* --- корзина --- */
function renderCart() {
  view = "cart";
  if (inTg) tg.BackButton.show();
  $("app").innerHTML = `<button class="back" id="toCatalog">← В каталог</button><h1>Корзина</h1>` + (cart.length
    ? cart.map((c, i) => { const p = byId(c.id); return `
      <div class="row">
        <div class="ph" style="background:${p.color}">${p.emoji}</div>
        <div class="info"><div>${p.name}</div><div class="meta">Размер ${c.size} · ${fmt(p.price)}</div></div>
        <div class="qty"><button data-dec="${i}">−</button><span>${c.qty}</span><button data-inc="${i}">+</button></div>
      </div>`; }).join("") + `<div class="total"><span>Итого</span><span>${fmt(total())}</span></div>`
    : `<div class="empty">Корзина пуста. Выберите что-нибудь в каталоге.</div>`);
  updateMain();
}

function checkout() {
  const order = { items: cart.map(({ id, size, qty }) => ({ id, size, qty })) };
  if (inTg) tg.sendData(JSON.stringify(order)); // бот получит web_app_data, мини-апп закроется
  else alert("Заказ (в Telegram уйдёт боту):\n" + JSON.stringify(order, null, 2));
}

/* --- события --- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.cat) { category = t.dataset.cat; renderCatalog(); }
  else if (t.dataset.id) { haptic(); openProduct(+t.dataset.id); }
  else if (t.dataset.size) {
    pick.size = t.dataset.size;
    document.querySelectorAll(".size").forEach((b) => b.classList.toggle("on", b === t));
  } else if (t.id === "add") {
    const same = cart.find((c) => c.id === pick.id && c.size === pick.size);
    same ? same.qty++ : cart.push({ ...pick, qty: 1 });
    haptic("medium"); closeProduct(); updateMain();
  } else if (t.dataset.inc || t.dataset.dec) {
    const i = +(t.dataset.inc ?? t.dataset.dec);
    cart[i].qty += t.dataset.inc ? 1 : -1;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    haptic(); renderCart();
  } else if (t.id === "toCatalog") renderCatalog();
});
$("shade").addEventListener("click", closeProduct);
if (inTg) tg.BackButton.onClick(renderCatalog);

fetch("products.json").then((r) => r.json()).then((data) => { products = data; renderCatalog(); });
</script>
</body>
</html>
